version: "3.8"
services:
  server:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      DB_PATH: "/data/testharness.db"
    volumes: ["th-data:/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]

volumes:
  th-data:
  ollama-models:
